appId: com.jobsift.app
productName: JobSift

directories:
  output: dist

files:
  - src/**
  - ui/**
  - assets/**
  - resources/**
  - package.json
  # Editing over a network/FUSE mount leaves orphaned .fuse_hidden* files beside
  # their originals. They are gitignored but still on disk, and src/** would
  # otherwise bundle stale copies of eval.js and ats-http.js into the installer.
  - "!**/.fuse_hidden*"
  # Never ship editor, OS or VCS debris picked up by the broad globs above.
  - "!**/*.map"
  - "!**/.DS_Store"
  - "!**/Thumbs.db"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/jobsift-icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/jobsift-icon.ico
  uninstallerIcon: assets/jobsift-icon.ico

mac:
  target:
    - target: dmg
  icon: assets/jobsift-icon.icns
  category: public.app-category.productivity

publish:
  provider: github
  owner: o-i-z-y-s
  repo: jobsift-electron
