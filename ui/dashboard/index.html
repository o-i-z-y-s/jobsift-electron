<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobSift Dashboard</title>
<!--
  Deliberately narrow. Both pages use inline event handlers, so script-src
  cannot be locked down without refactoring those first, and no script-src or
  style-src directive is set here: with no default-src, an unlisted directive is
  simply not enforced, so nothing below can break rendering.

  What it does buy: these pages never call fetch/XHR/WebSocket, never embed a
  frame or object, and have no forms. Denying all of those means markup injected
  through scraped job data cannot phone home, pull a second stage, or post
  anywhere, even though it could still run. Tighten to
  "default-src 'none'; script-src 'self'" once the inline handlers move into
  ui/shared/.
-->
<meta http-equiv="Content-Security-Policy"
      content="connect-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="../shared/tokens.css">
<script src="../shared/dom.js"></script>
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* Scrollbars themed to the app palette */
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  ::-webkit-scrollbar-corner { background: var(--bg); }

  /* Spinner shown while a scrape is in progress */
  @keyframes jobsift-spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 15px; height: 15px; flex-shrink: 0;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: jobsift-spin 0.8s linear infinite;
  }

  /* ── Drop zone ──────────────────────────────────── */
  #dropzone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 20px;
    padding: 40px;
  }
  #dropzone h1 { font-size: 20px; font-weight: 700; }
  #dropzone p  { color: var(--muted); font-size: 13px; text-align: center; }

  #file-input { display: none; }

  .browse-btn {
    margin-top: 12px;
    display: inline-block;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 20px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .browse-btn:hover { background: var(--accent-hover); }

  #error-msg {
    display: none;
    color: var(--grade-d);
    background: color-mix(in srgb, var(--grade-d) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--grade-d) 30%, transparent);
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 13px;
    max-width: 500px;
    text-align: center;
  }

  /* ── Dashboard ──────────────────────────────────── */
  #dashboard { display: none; }

  header {
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
    border-bottom: 1px solid var(--border);
    padding: 24px 32px 20px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  header .meta {
    margin-top: 6px;
    color: var(--muted);
    font-size: 13px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }

  .reload-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    align-self: flex-start;
  }
  .reload-btn:hover { border-color: var(--accent); color: var(--accent); }


  .stats-bar {
    display: flex;
    gap: 12px;
    padding: 16px 32px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .stat-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-chip .val { font-weight: 700; font-size: 13px; color: var(--text); }

  /* ── Filter bar ─────────────────────────────────── */
  .filter-bar {
    display: flex;
    gap: 28px;
    padding: 10px 32px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-group {
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 12px;
  }
  .filter-group > span {
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
  }
  .filter-group label {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    color: var(--text);
    font-size: 12px;
    user-select: none;
  }
  .filter-group input[type=checkbox],
  .filter-group input[type=radio] { accent-color: var(--accent); cursor: pointer; }


  /* ── Section ────────────────────────────────────── */
  .section { padding: 20px 32px 32px; }

  .section-header {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    padding: 24px 0 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-header .pill {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--muted);
    text-transform: none;
    letter-spacing: 0;
  }
  .section-header .count {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
  }

  /* ── Tab bar ────────────────────────────────────── */
  .tab-bar {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    padding: 9px 18px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
  }
  .tab-btn.active  { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn:hover:not(.active) { color: var(--text); }
  .tab-count {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1px 6px;
    font-size: 10px;
    color: var(--muted);
    font-weight: 400;
  }

  /* ── Scrollable table wrapper ────────────────────── */
  .table-scroll {
    max-height: 500px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 8px 8px;
  }
  .table-scroll::-webkit-scrollbar { width: 6px; }
  .table-scroll::-webkit-scrollbar-track { background: transparent; }
  .table-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .table-scroll::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  .table-scroll table { width: 100%; border-collapse: collapse; }

  /* Sticky header inside scroll */
  .table-scroll thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--surface2);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    user-select: none;
  }
  .table-scroll thead th.sortable { cursor: pointer; }
  .table-scroll thead th.sortable:hover { color: var(--text); }
  .sort-icon { margin-left: 4px; opacity: 0.35; font-size: 10px; }
  th.sort-active .sort-icon { opacity: 1; color: var(--accent); }

  tbody tr.job-row {
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
  }
  tbody tr.job-row:hover    { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  tbody tr.job-row.expanded { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  tbody td { padding: 11px 12px; vertical-align: middle; }
  /* Centered columns (Grade, Apply) - header and cells */
  .table-scroll th.col-center, .table-scroll td.col-center { text-align: center; }

  /* Company names wrap so a long one cannot widen its column and squeeze the
     role title; the role keeps a minimum width so it always has room. */
  .company-name  { font-weight: 600; color: var(--text); max-width: 220px; overflow-wrap: anywhere; }
  .role-title    { color: var(--accent); font-weight: 500; font-size: 13px; min-width: 240px; }
  .location-text { color: var(--muted); font-size: 12px; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .grade-A { background: color-mix(in srgb, var(--grade-a) 15%, transparent);  color: var(--grade-a); border: 1px solid color-mix(in srgb, var(--grade-a) 30%, transparent); }
  .grade-B { background: color-mix(in srgb, var(--grade-b) 12%, transparent); color: var(--grade-b); border: 1px solid color-mix(in srgb, var(--grade-b) 30%, transparent); }
  .grade-C { background: color-mix(in srgb, var(--grade-c) 15%, transparent);  color: var(--grade-c); border: 1px solid color-mix(in srgb, var(--grade-c) 30%, transparent); }

  .cap-arrow { font-size: 9px; opacity: 0.75; }

  /* Track badges */
  /* Track badges take their color from --track-color, assigned per track in
     render() in the order tracks are configured, so any track name works. */
  .badge.track {
    background: color-mix(in srgb, var(--track-color, var(--muted)) 14%, transparent);
    color: var(--track-color, var(--muted));
    border: 1px solid color-mix(in srgb, var(--track-color, var(--muted)) 25%, transparent);
  }

  /* Employment type and poster labels, shown only when they tell you something:
     not for Full-time roles, and not when the employer posted it. */
  .badge.tag { margin-left: 6px; font-weight: 500;
    background: color-mix(in srgb, var(--muted) 12%, transparent); color: var(--muted);
    border: 1px solid color-mix(in srgb, var(--muted) 25%, transparent); }
  .badge.tag.target { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
    border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .badge.tag.board { color: var(--flag); background: color-mix(in srgb, var(--flag) 10%, transparent);
    border-color: color-mix(in srgb, var(--flag) 30%, transparent); }
  .source-block { font-size: 12px; color: var(--muted); margin-bottom: 8px; line-height: 1.5; }
  .source-block strong { color: var(--text); font-weight: 600; }
  .source-block ul { margin: 2px 0 0 16px; padding: 0; }
  .source-block a { color: var(--accent); }

  /* Work type badges */
  .type-remote   { background: color-mix(in srgb, var(--grade-a) 8%, transparent); color: var(--tint-green); border: 1px solid color-mix(in srgb, var(--grade-a) 20%, transparent); font-weight: 500; }
  .type-hybrid   { background: color-mix(in srgb, var(--accent) 8%, transparent); color: var(--tint-blue); border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent); font-weight: 500; }
  .type-inperson { background: color-mix(in srgb, var(--grade-c) 8%, transparent); color: var(--tint-amber); border: 1px solid color-mix(in srgb, var(--grade-c) 20%, transparent); font-weight: 500; }

  /* Posted age coloring */
  .posted-Fresh   { color: var(--fresh); }
  .posted-Ripe    { color: var(--ripe);  }
  .posted-Open    { color: var(--open);  }
  .posted-Stale   { color: var(--stale); font-style: italic; }
  .posted-Ghost   { color: var(--ghost); font-style: italic; }
  .posted-Unknown { color: var(--muted); }

  .salary         { color: var(--text); white-space: nowrap; font-size: 13px; }
  .salary.unknown { color: var(--muted); font-style: italic; }

  /* ── Source tabs (Jobright / ATS Direct) ──────────── */
  .source-tab-bar { display: flex; gap: 4px; align-items: center; }
  .source-tab {
    padding: 4px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .source-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .source-tab.active .tab-count { color: #fff; }
  .source-tab .tab-count {
    display: inline-block;
    background: rgba(255,255,255,0.18);
    border-radius: 10px;
    padding: 0 5px;
    margin-left: 4px;
    font-size: 11px;
  }

  .apply-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 12px;
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    border-radius: 4px;
    padding: 3px 8px;
    display: inline-block;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .apply-link:hover { background: color-mix(in srgb, var(--accent) 15%, transparent); }

  .expand-icon {
    color: var(--muted);
    font-size: 12px;
    display: inline-block;
    transition: transform 0.2s;
  }

  /* Detail row */
  .detail-row { display: none; }
  .detail-row.visible { display: table-row; }

  .detail-cell {
    padding: 0 12px 16px 12px;
    background: var(--surface);
    border-bottom: 2px solid var(--accent2);
  }
  .detail-inner {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding-top: 16px;
  }
  .detail-block h4 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .dim-table { width: 100%; border-collapse: collapse; }
  .dim-table td {
    padding: 5px 8px;
    font-size: 12px;
    border-bottom: 1px solid var(--border);
  }
  .dim-table tr:last-child td { border-bottom: none; }
  .dim-table td:first-child  { color: var(--muted); width: 52%; }
  .dim-table td:nth-child(2) { font-weight: 700; text-align: center; width: 13%; }
  .dim-table td:last-child   { color: var(--muted); font-size: 11px; }
  .dim-table.match-table td:first-child  { width: 22%; }
  .dim-table.match-table td:nth-child(2) { width: 18%; white-space: nowrap; }

  .dim-5 { color: var(--grade-a); }
  .dim-4 { color: var(--tint-sky); }
  .dim-3 { color: var(--text); }
  .dim-2 { color: var(--stale); }
  .dim-1 { color: var(--grade-d); }

  .raw-score {
    margin-top: 10px;
    padding: 8px 10px;
    background: var(--surface2);
    border-radius: 6px;
    font-size: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .raw-score span   { color: var(--muted); }
  .raw-score strong { color: var(--text); }
  .cap-explain { color: var(--flag); }

  .notes-text {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
    background: var(--surface2);
    border-radius: 6px;
    padding: 10px;
  }

  .prescreen {
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .prescreen-item {
    font-size: 12px;
    display: flex;
    align-items: flex-start;
    gap: 7px;
  }
  .ps-icon { width: 16px; flex-shrink: 0; margin-top: 1px; }
  .ps-pass { color: var(--grade-a); }
  .ps-warn { color: var(--flag); }

  .addendum-note {
    background: color-mix(in srgb, var(--grade-c) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--grade-c) 25%, transparent);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    color: var(--stale);
    margin-top: 10px;
  }

  /* Observation / Key insight */
  .observation-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.75;
    margin-bottom: 24px;
  }
  .observation-box strong { color: var(--text); }

  .no-results {
    text-align: center;
    padding: 40px;
    color: var(--muted);
    font-size: 13px;
  }

  /* ── Rejected panel ─────────────────────────────── */
  .rej-panel {
    margin-top: 32px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .rej-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: var(--surface);
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid transparent;
    transition: background 0.15s, border-color 0.15s;
  }
  .rej-header:hover { background: var(--surface2); }
  .rej-header.open  { border-bottom-color: var(--border); }

  .rej-header-label {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .rej-counts {
    margin-left: 4px;
    display: flex;
    gap: 6px;
  }
  .tier1-pill {
    background: color-mix(in srgb, var(--grade-c) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--grade-c) 30%, transparent);
    border-radius: 10px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--tier1);
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
  }
  .tier2-pill {
    background: color-mix(in srgb, var(--muted) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--muted) 20%, transparent);
    border-radius: 10px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--tier2);
    text-transform: none;
    letter-spacing: 0;
  }

  .rej-toggle-icon {
    color: var(--muted);
    font-size: 11px;
    margin-left: auto;
    transition: transform 0.2s;
  }

  /* Rejected sub-filter bar */
  .rej-filter-bar {
    display: none;
    gap: 28px;
    padding: 9px 16px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    align-items: center;
  }
  .rej-filter-bar.visible { display: flex; }
  /* Role type buttons in the rejected panel: one row, wrapping when needed. */
  .rej-tab-buttons { display: flex; flex-wrap: wrap; gap: 2px; }

  /* Reason category badge */
  .reason-cat {
    display: inline-block;
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .rcat-salary_missing { background: color-mix(in srgb, var(--muted) 10%, transparent); color: var(--muted); border: 1px solid color-mix(in srgb, var(--muted) 20%, transparent); }
  .rcat-salary_floor  { background: color-mix(in srgb, var(--grade-c) 12%, transparent); color: var(--grade-c); border: 1px solid color-mix(in srgb, var(--grade-c) 25%, transparent); }
  .rcat-clearance     { background: color-mix(in srgb, var(--grade-d) 12%, transparent);  color: var(--grade-d); border: 1px solid color-mix(in srgb, var(--grade-d) 25%, transparent); }
  .rcat-geo_restriction { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--tint-blue); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); }
  .rcat-travel        { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--tint-blue); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); }
  .rcat-domain_exclusion { background: color-mix(in srgb, var(--muted) 10%, transparent); color: var(--muted); border: 1px solid color-mix(in srgb, var(--muted) 20%, transparent); }
  .rcat-title_level   { background: color-mix(in srgb, var(--muted) 10%, transparent); color: var(--muted); border: 1px solid color-mix(in srgb, var(--muted) 20%, transparent); }
  .rcat-blocked_title { background: color-mix(in srgb, var(--muted) 10%, transparent); color: var(--muted); border: 1px solid color-mix(in srgb, var(--muted) 20%, transparent); }
  .rcat-prescreen     { background: color-mix(in srgb, var(--muted) 10%, transparent); color: var(--muted); border: 1px solid color-mix(in srgb, var(--muted) 20%, transparent); }
  .rcat-grade_d       { background: color-mix(in srgb, var(--grade-d) 8%, transparent);  color: var(--grade-d); border: 1px solid color-mix(in srgb, var(--grade-d) 20%, transparent); }
  .rcat-employment_type { background: color-mix(in srgb, var(--muted) 10%, transparent); color: var(--muted); border: 1px solid color-mix(in srgb, var(--muted) 20%, transparent); }
  .rcat-repost        { background: color-mix(in srgb, var(--grade-d) 8%, transparent);  color: var(--grade-d); border: 1px solid color-mix(in srgb, var(--grade-d) 20%, transparent); }
  .rcat-other         { background: color-mix(in srgb, var(--muted) 10%, transparent); color: var(--muted); border: 1px solid color-mix(in srgb, var(--muted) 20%, transparent); }

  /* Rejected detail cell */
  .rej-detail-cell {
    padding: 12px 16px 16px;
    background: var(--surface);
    border-bottom: 2px solid color-mix(in srgb, var(--muted) 30%, transparent);
  }
  .rej-reason-full {
    font-size: 12px;
    color: var(--text);
    background: var(--surface2);

  }

  }

  @media (max-width: 900px) {
