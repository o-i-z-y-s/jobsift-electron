    .section       { padding: 0 16px 24px; }
    header         { padding: 16px; }
    .stats-bar     { padding: 12px 16px; }
    .filter-bar    { padding: 10px 16px; gap: 16px; }
  }
</style>
</head>
<body>

<!-- ── Drop zone ─────────────────────────────────────── -->
<div id="dropzone">
  <h1>JobSift</h1>
  <!-- progress panel (shown during a scrape) -->
  <div id="progress-panel" style="display:none;width:100%;max-width:620px;margin:0 auto 24px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px 24px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="display:flex;align-items:center;gap:10px">
        <span class="spinner"></span>
        <span id="progress-msg" style="font-size:14px;font-weight:600">Starting...</span>
      </span>
      <span id="progress-pct" style="font-size:13px;color:var(--muted)">0%</span>
    </div>
    <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden">
      <div id="progress-bar" style="height:100%;background:var(--accent);width:0%;transition:width .3s"></div>
    </div>
    <!-- live activity feed so the run is not a black box -->
    <div id="progress-log" style="margin-top:14px;height:200px;overflow-y:scroll;text-align:left;font-size:12px;line-height:1.6;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button id="cancel-btn" onclick="cancelScrape()" style="background:none;border:1px solid var(--border);color:var(--muted);padding:6px 16px;border-radius:5px;font-size:12px;cursor:pointer">Cancel Scrape</button>
      <button id="abort-pass-btn" onclick="abortPass()" title="Skip the current Jobright pass and continue with the next" style="background:none;border:1px solid var(--border);color:var(--muted);padding:6px 16px;border-radius:5px;font-size:12px;cursor:pointer">Abort Pass</button>
    </div>
  </div>
  <!-- empty state (no results yet) -->
  <div id="empty-state" style="text-align:center;color:var(--muted);padding:40px 0">
    <div style="font-size:48px;margin-bottom:16px">&#128269;</div>
    <p style="font-size:15px;margin-bottom:8px" id="empty-heading">No results yet.</p>
    <p style="font-size:13px" id="empty-subtext">Sign in to Jobright, then run a search.</p>
    <div id="auth-status" style="margin:14px auto 0;display:inline-block;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:5px 14px">Checking Jobright session…</div>
    <div style="display:flex;gap:12px;justify-content:center;align-items:flex-start;margin-top:18px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)">Period
          <select class="run-period" onchange="setRunPeriod(this.value)" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:8px 10px;border-radius:6px;font-size:13px;cursor:pointer">
            <option value="1">Past 24 hours</option>
            <option value="3">Past 3 days</option>
            <option value="7" selected>Past week</option>
            <option value="30">Past month</option>
          </select>
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer" title="Show roles even if they appeared in previous runs (skips cross-run de-duplication)">
          <input type="checkbox" class="include-seen" onchange="setIncludeSeen(this.checked)"> Include previously seen
        </label>
      </div>
      <button onclick="runNow()" style="background:var(--accent);color:#fff;border:none;padding:9px 22px;border-radius:6px;font-size:14px;cursor:pointer;font-weight:600">&#9654; Run Now</button>
      <button id="signin-btn" onclick="window.electronAPI?.openLoginWindow()" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:9px 22px;border-radius:6px;font-size:14px;cursor:pointer">Sign In to Jobright</button>
      <button onclick="openConfig()" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:9px 22px;border-radius:6px;font-size:14px;cursor:pointer">&#9881; Configuration</button>
      <button onclick="openSchedule()" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:9px 22px;border-radius:6px;font-size:14px;cursor:pointer">&#128197; Schedule</button>
      <button onclick="loadPastResult()" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:9px 22px;border-radius:6px;font-size:14px;cursor:pointer">Load Past Result</button>
    </div>
  </div>
  <input type="file" id="file-input" accept=".json" style="display:none">
  <div id="error-msg"></div>
</div>

<!-- ── Dashboard ─────────────────────────────────────── -->
<div id="dashboard">
  <header>
    <div>
      <h1>JobSift</h1>
      <div class="meta" id="header-meta"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="auth-status-header" style="font-size:12px;font-weight:600;color:var(--muted);margin-right:4px"></span>
      <select class="run-period" onchange="setRunPeriod(this.value)" title="Scan period" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:7px 10px;border-radius:6px;font-size:13px;cursor:pointer">
        <option value="1">Past 24 hours</option>
        <option value="3">Past 3 days</option>
        <option value="7" selected>Past week</option>
        <option value="30">Past month</option>
      </select>
      <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer" title="Show roles even if they appeared in previous runs (skips cross-run de-duplication)">
        <input type="checkbox" class="include-seen" onchange="setIncludeSeen(this.checked)"> Incl. seen
      </label>
      <button onclick="runNow()" style="background:var(--accent);color:#fff;border:none;padding:7px 18px;border-radius:6px;font-size:13px;cursor:pointer;font-weight:600">&#9654; Run Now</button>
      <button class="reload-btn" onclick="openConfig()">&#9881; Configuration</button>
      <button class="reload-btn" onclick="resetToDropzone()">&#8962; Return to Home</button>
    </div>
  </header>

  <div class="stats-bar" id="stats-bar"></div>

  <!-- Global filters: Source + Track + Type -->
  <div class="filter-bar">
    <div class="filter-group">
      <span>Source</span>
      <div class="source-tab-bar">
        <button class="source-tab active" id="src-jobright" onclick="handleSourceTab('jobright')">Jobright <span class="tab-count" id="src-jobright-count">0</span></button>
        <button class="source-tab"        id="src-ats"      onclick="handleSourceTab('ats')">ATS Direct <span class="tab-count" id="src-ats-count">0</span></button>
      </div>
    </div>
    <div class="filter-group" id="track-filter-group">
      <span>Track</span>
      <!-- populated dynamically by render() from meta.track_labels -->
    </div>
    <div class="filter-group" id="type-filter-group">
      <span title="Set in Configuration, Tracks tab, under Role Types" style="cursor:help">Role Type</span>
      <!-- populated dynamically by render() from role_cat values in loaded data -->
    </div>
    <!-- Built by render() from the values that came up in the loaded run. -->
    <div class="filter-group" id="emp-filter-group"><span>Employment</span></div>
    <div class="filter-group" id="by-filter-group"><span>Posted by</span></div>
    <button class="browse-btn" style="padding:4px 10px;font-size:11px;background:var(--surface2);color:var(--muted);border:1px solid var(--border);margin-left:auto"
            onclick="resetFilters()">Reset filters</button>
  </div>

  <div class="section">
    <div class="observation-box" id="observation-box"></div>

    <!-- Remote section -->
    <div class="section-header">
      🌐 Remote
      <span class="count" id="remote-count"></span>
    </div>
    <div id="remote-section"></div>

    <!-- Hybrid section -->
    <div class="section-header" style="margin-top:8px">
      <span id="label-hybrid">🔀 Hybrid Local</span>
      <span class="count" id="hybrid-count"></span>
    </div>
    <div id="hybrid-section"></div>

    <!-- In-Person section -->
    <div class="section-header" style="margin-top:8px">
      <span id="label-inperson">📍 In-Person Local</span>
      <span class="count" id="inperson-count"></span>
    </div>
    <div id="inperson-section"></div>

    <!-- ── Rejected panel ─────────────────────────── -->
    <div class="rej-panel" id="rej-panel">
      <!-- Clickable header -->
      <div class="rej-header" id="rej-header" onclick="toggleRejPanel()">
        <div class="rej-header-label">
          ✗ Screened Out
          <div class="rej-counts">
            <span class="tier1-pill" id="rej-t1-pill"></span>
            <span class="tier2-pill" id="rej-t2-pill" style="display:none"></span>
          </div>
        </div>
        <span class="rej-toggle-icon" id="rej-toggle-icon">▶</span>
      </div>

      <!-- Tier + tab filter bar - visible only when panel is open -->
      <div class="rej-filter-bar" id="rej-filter-bar">
        <div class="filter-group">
          <span>Show</span>
          <label><input type="radio" name="tier" id="tier-t1" value="tier1" checked onchange="onRejFilterChange()"> Near-miss only</label>
          <label><input type="radio" name="tier" id="tier-all" value="all" onchange="onRejFilterChange()"> All rejections</label>
        </div>
        <div class="filter-group" id="rej-tab-group">
          <span title="Set in Configuration, Tracks tab, under Role Types" style="cursor:help">Role Type</span>
          <div id="rej-tab-buttons" class="rej-tab-buttons"><!-- built by renderRejectedSection() from the role types present --></div>
        </div>
      </div>

      <!-- Content (lazy-rendered on first open) -->
      <div id="rej-content" style="display:none"></div>
    </div>

  </div><!-- /section -->
</div><!-- /dashboard -->

<script>
// ═══════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════
// Results saved before the match score (out of 100) carry six 1-5 dimension
// scores instead. Both are shown, so older runs stay readable.
const DIM_LABELS = [
  'D1 - Title Quality',
  'D2 - Scope & Complexity',
  'D3 - Domain Fit',
  'D4 - Qualifications Match',
  'D5 - Salary Fit',
  'D6 - Work Arrangement',
];
const DIM_KEYS  = ['d1','d2','d3','d4','d5','d6'];
const GRADE_ORDER = { 'A': 1, 'B': 2, 'C': 3 };

// Same order as CAT_ORDER in src/eval.js, plus title_level, which appears only in
// results saved by earlier versions and is kept so they show a readable label.
const REJ_CAT_ORDER = [
  'salary_floor','salary_missing','clearance','geo_restriction','travel','employment_type','blocked_title',
  'domain_exclusion','title_level','repost','prescreen','grade_d','other'
];
const REJ_CAT_LABELS = {
  salary_floor:     'Salary Below Floor',
  salary_missing:   'Salary Not Listed',
  clearance:        'Clearance Required',
  geo_restriction:  'Geographic Restriction',
  travel:           'Travel Requirement',
  domain_exclusion: 'Domain / Expertise',
  blocked_title:    'Blocked Title Keyword',
  title_level:      'Title Level Mismatch',
  prescreen:        'Pre-Screen Failure',
  grade_d:          'Score Below Your Bar',
  employment_type:  'Employment Type Not Accepted',
  repost:           'Reposted Listing',
  other:            'Other',
};

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let allRoles    = [];
let filteredRoles = [];
let allRejRoles = [];
let rejRendered = false;
let rejOpen     = false;
let sourceTab   = 'jobright';

const isAtsRole = r => !!(r.id && r.id.startsWith('ats_'));

// Track colors, assigned in configured order from the palette's --track-N
// tokens. Values only ever come from TRACK_COLORS, never from data, so they are
// safe in a style attribute.
const TRACK_COLORS = [1, 2, 3, 4, 5, 6, 7].map(n => `var(--track-${n})`);
let trackColors = {};
function trackColor(key) {
  if (!(key in trackColors)) trackColors[key] = TRACK_COLORS[Object.keys(trackColors).length % TRACK_COLORS.length];
  return trackColors[key];
}

const sectionState = {
  remote:   { tab: null, sortCol: 'grade', sortDir: 'asc' },
  hybrid:   { tab: null, sortCol: 'grade', sortDir: 'asc' },
  inperson: { tab: null, sortCol: 'grade', sortDir: 'asc' },
};
// tab: the selected role type label, or null for "All".
const rejState = { tab: null, sortCol: 'category', sortDir: 'asc', tier: 'tier1' };

// ═══════════════════════════════════════════════════════════════
// ELECTRON BOOT
// ═══════════════════════════════════════════════════════════════
const fileInput  = document.getElementById('file-input');
const errorMsg   = document.getElementById('error-msg');

// Reflect Jobright auth state in both status badges and the Sign In button.
function updateAuthBadge(loggedIn) {
  const text  = loggedIn ? '✓ Jobright session authenticated' : '⚠ Not signed in to Jobright';
  const color = loggedIn ? 'var(--green)' : 'var(--muted)';
  const home = document.getElementById('auth-status');
  if (home) {
    home.textContent = text;
    home.style.color = color;
    home.style.borderColor = loggedIn ? 'var(--green)' : 'var(--border)';
  }
  const hdr = document.getElementById('auth-status-header');
  if (hdr) { hdr.textContent = text; hdr.style.color = color; }
  const btn = document.getElementById('signin-btn');
  if (btn) btn.style.display = loggedIn ? 'none' : '';
}

// Re-check the session and refresh the badge.
function refreshAuthBadge() {
  if (!window.electronAPI?.isLoggedIn) return;
  window.electronAPI.isLoggedIn().then(updateAuthBadge).catch(() => {});
}

function setSignedIn() {
  document.getElementById('empty-heading').textContent = 'Ready to run.';
  document.getElementById('empty-subtext').textContent = 'Click Run Now to start a search.';
  updateAuthBadge(true);
  // Clear any stale "not signed in" prompt now that the session is valid.
  if (errorMsg) errorMsg.style.display = 'none';
}

// Shown when Run Now is pressed without a Jobright session. Friendly prompt
// rather than a red failure; the sign-in window is opened by the main process.
function showAuthNeeded() {
  document.getElementById('dashboard').style.display     = 'none';
  document.getElementById('dropzone').style.display      = 'flex';
  document.getElementById('progress-panel').style.display = 'none';
  document.getElementById('empty-state').style.display   = 'block';
  document.getElementById('empty-heading').textContent   = 'Sign in to Jobright to continue';
  document.getElementById('empty-subtext').textContent   = 'A sign-in window has opened. After you sign in, press Run Now.';
  updateAuthBadge(false);
  if (errorMsg) errorMsg.style.display = 'none';
}

// Load latest result on startup
if (window.electronAPI) {
  // Check auth state immediately so the empty state reflects the persisted session.
  window.electronAPI.isLoggedIn().then(loggedIn => {
    updateAuthBadge(loggedIn);
    if (loggedIn) setSignedIn();
  }).catch(() => {});

  // Stay on the home/landing screen at launch instead of auto-loading the last
  // run. The user can open a previous run via "Load Past Result", and a fresh
  // run renders automatically on completion.

  // Restore the persisted scan period into the selectors.
  window.electronAPI.getRunPeriod?.().then(days => {
    if (days) setRunPeriod(days, /*persist=*/false);
  }).catch(() => {});

  // Scrape progress events: store cleanup fns to prevent listener accumulation on reload
  const _cleanupProgress = window.electronAPI.onScrapeProgress(({ step, message, pct }) => {
    // progress-panel lives inside #dropzone, so we must ensure dropzone is visible
    // regardless of whether the dashboard is currently showing (re-scrape case).
    document.getElementById('dashboard').style.display    = 'none';
    document.getElementById('dropzone').style.display     = 'flex';
    document.getElementById('empty-state').style.display  = 'none';
    document.getElementById('progress-panel').style.display = 'block';
    document.getElementById('progress-msg').textContent   = message;
    document.getElementById('progress-pct').textContent   = Math.round(pct) + '%';
    document.getElementById('progress-bar').style.width   = Math.round(pct) + '%';
    // First step of a run (auth check): clear any stale feed and reset Cancel,
    // so tray-initiated runs also start fresh.
    if (step === 'auth') {
      const log = document.getElementById('progress-log');
      if (log) log.innerHTML = '';
      const btn = document.getElementById('cancel-btn');
      if (btn) { btn.textContent = 'Cancel Scrape'; btn.disabled = false; btn.style.opacity = '1'; }
      if (errorMsg) errorMsg.style.display = 'none';
    }
    appendProgressLog(message);
  });

  const _cleanupComplete = window.electronAPI.onScrapeComplete(({ outputPath, counts, canceled }) => {
    document.getElementById('progress-panel').style.display = 'none';
    // A run that reviewed nothing (canceled early, all duplicates, or no matches)
    // should explain itself instead of showing a blank board.
    if (counts && (counts.accepted | 0) === 0 && (counts.rejected | 0) === 0) {
      resetToDropzone();
      document.getElementById('empty-heading').textContent =
        canceled ? 'Run canceled - nothing to show yet' : 'No new listings to review';
      document.getElementById('empty-subtext').textContent = canceled
        ? 'The scrape was stopped before any roles were collected. A (empty) result was still saved.'
        : 'Everything found was already seen in a previous run (deduplicated), or nothing matched. '
          + 'Check the activity feed counts, try a longer period, or open a previous run with Load Past Result.';
      return;
    }
    // Otherwise render the saved artifact (partial if canceled mid-run).
    window.electronAPI.getLatestResult().then(data => { if (data) render(data); });
  });

  const _cleanupError = window.electronAPI.onScrapeError(({ message }) => {
    document.getElementById('progress-panel').style.display = 'none';
    document.getElementById('empty-state').style.display    = 'block';
    showError('Scrape failed: ' + message);
  });

  const _cleanupCanceled = window.electronAPI.onScrapeCanceled?.(() => {
    // Leave the progress view instead of hanging on the last message.
    resetToDropzone();
    document.getElementById('empty-heading').textContent = 'Run canceled';
    document.getElementById('empty-subtext').textContent = 'The scan was stopped. Press Run Now to start again.';
  });

  const _cleanupLogin = window.electronAPI.onLoginComplete(() => setSignedIn());
  const _cleanupAuthReq = window.electronAPI.onAuthRequired?.(() => showAuthNeeded());

  // Remove listeners before page reloads so they don't stack
  window.addEventListener('beforeunload', () => {
    _cleanupProgress?.();
    _cleanupComplete?.();
    _cleanupError?.();
    _cleanupCanceled?.();
    _cleanupLogin?.();
    _cleanupAuthReq?.();
  });
}

// File input still works as a fallback (load any result JSON manually)
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try   { render(JSON.parse(ev.target.result)); }
    catch (err) { showError('Invalid JSON: ' + err.message); }
  };
  reader.readAsText(file);
});

// Scan period in days, mirroring the CLI (24h / 3d / 1 week / 1 month).
let _runPeriod = 7;
function setRunPeriod(v, persist = true) {
  _runPeriod = parseInt(v, 10) || 7;
  // Keep the empty-state and header selectors in sync.
  document.querySelectorAll('.run-period').forEach(s => { s.value = String(_runPeriod); });
  // Persist the choice so it survives restarts and is used by the tray Run Now.
  if (persist) window.electronAPI?.setRunPeriod?.(_runPeriod);
}

function openConfig() {
  // Navigate this same window to the Configuration page (no second window).
  window.location.href = '../config/index.html';
}

function openSchedule() {
  // Same window, deep-linked to the Scheduled Runs section of Settings.
  window.location.href = '../config/index.html?goto=schedule';
}

// When checked, the run skips cross-run de-duplication and shows its full set.
let _includeSeen = false;
function setIncludeSeen(v) {
  _includeSeen = !!v;
  document.querySelectorAll('.include-seen').forEach(c => { c.checked = _includeSeen; });
}

// Append a line to the live activity feed, skipping consecutive duplicates and
// keeping the list to a sane length.
function appendProgressLog(message) {
  const log = document.getElementById('progress-log');
  if (!log || !message) return;
  const last = log.lastChild;
  // Collapse repetitive "n/total" progress: if the new line has the same text
  // before the ratio as the previous line, update that line in place instead of
  // printing a new one for every page.
  const RATIO = /^(.*?)(\d+)\s*\/\s*(\d+)\s*$/;
  const m = message.match(RATIO);
  if (m && last) {
    const lm = (last.textContent || '').match(RATIO);
    if (lm && lm[1] === m[1]) { last.textContent = message; log.scrollTop = log.scrollHeight; return; }
  }
  if (last && last.textContent === message) return;  // skip consecutive duplicates
  const line = document.createElement('div');
  line.textContent = message;
  log.appendChild(line);
  while (log.childElementCount > 100) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}

// Cancel wrapper: signal the main process and reflect "stopping" in the UI so the
// user knows the request was received (cancellation finishes the current item).
function cancelScrape() {
  if (!window.electronAPI) return;
  window.electronAPI.cancelScrape();
  const btn = document.getElementById('cancel-btn');
  if (btn) { btn.textContent = 'Canceling…'; btn.disabled = true; btn.style.opacity = '0.6'; }
  appendProgressLog('Canceling… finishing the current request.');
}

// Skip the current Jobright pass and roll over to the next, without ending the run.
function abortPass() {
  if (!window.electronAPI?.abortPass) return;
  window.electronAPI.abortPass();
  appendProgressLog('Abort pass requested; rolling over to the next pass…');
}

function runNow() {
  if (!window.electronAPI) { showError('Electron API not available.'); return; }
  // Clear any stale message (e.g. "No past results found.") and reset the feed.
  if (errorMsg) errorMsg.style.display = 'none';
  const log = document.getElementById('progress-log');
  if (log) log.innerHTML = '';
  const btn = document.getElementById('cancel-btn');
  if (btn) { btn.textContent = 'Cancel Scrape'; btn.disabled = false; btn.style.opacity = '1'; }
  window.electronAPI.startScrape({ daysAgo: _runPeriod, includeSeen: _includeSeen });
}

async function loadPastResult() {
  if (!window.electronAPI) {
    fileInput.click();
    return;
  }
  const paths = await window.electronAPI.listResults();
  if (!paths.length) { showError('No past results found.'); return; }
  openResultPicker(paths);
}

// Turn job-search-YYYY-MM-DD_HH-MM.json into a readable label.
function _prettyRunLabel(p) {
  const base = p.split(/[/\\]/).pop();
  const m = /(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})/.exec(base);
  return m ? `${m[1]}-${m[2]}-${m[3]}  ${m[4]}:${m[5]}` : base;
}

function closeResultPicker() {
  const el = document.getElementById('result-picker');
  if (el) el.remove();
}

function openResultPicker(paths) {
  closeResultPicker();
  const overlay = document.createElement('div');
  overlay.id = 'result-picker';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000';
  overlay.addEventListener('click', e => { if (e.target === overlay) closeResultPicker(); });

  const panel = document.createElement('div');
  panel.style.cssText = 'background:var(--surface);border:1px solid var(--border);border-radius:10px;max-width:440px;width:90%;max-height:70vh;overflow:auto;padding:18px 20px';
  let html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
           + '<strong style="font-size:15px">Load a past run</strong>'
           + '<button onclick="closeResultPicker()" style="background:none;border:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer">&times;</button></div>'
           + '<div style="display:flex;flex-direction:column;gap:6px">';
  paths.forEach((p, i) => {
    const label = _prettyRunLabel(p) + (i === 0 ? '  (latest)' : '');
    html += `<div style="display:flex;gap:6px;align-items:stretch">
      <button class="picker-row" data-idx="${i}" style="flex:1;text-align:left;background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:9px 12px;border-radius:6px;font-size:13px;cursor:pointer">${label}</button>
      <button class="picker-del" data-idx="${i}" title="Delete this run" aria-label="Delete this run" style="background:var(--surface2);color:var(--muted);border:1px solid var(--border);padding:0 12px;border-radius:6px;font-size:14px;cursor:pointer">&#128465;</button>
    </div>`;
  });
  html += '</div>';
  panel.innerHTML = html;
  overlay.appendChild(panel);
  document.body.appendChild(overlay);

  panel.querySelectorAll('.picker-row').forEach(btn => {
    btn.addEventListener('mouseenter', () => { btn.style.borderColor = 'var(--accent)'; });
    btn.addEventListener('mouseleave', () => { btn.style.borderColor = 'var(--border)'; });
    btn.addEventListener('click', async () => {
      const p = paths[parseInt(btn.getAttribute('data-idx'), 10)];
      try {
        const data = await window.electronAPI.loadResult(p);
        closeResultPicker();
        render(data);
      } catch (err) { showError('Failed to load: ' + err.message); }
    });
  });

  panel.querySelectorAll('.picker-del').forEach(btn => {
    btn.addEventListener('mouseenter', () => { btn.style.borderColor = 'var(--danger)'; btn.style.color = 'var(--danger)'; });
    btn.addEventListener('mouseleave', () => { btn.style.borderColor = 'var(--border)'; btn.style.color = 'var(--muted)'; });
    btn.addEventListener('click', async () => {
      const p = paths[parseInt(btn.getAttribute('data-idx'), 10)];
      if (!confirm(`Delete this run?\n\n${_prettyRunLabel(p)}\n\nThis permanently removes the saved result file.`)) return;
      try {
        await window.electronAPI.deleteResult(p);
        const remaining = await window.electronAPI.listResults();
        if (remaining.length) {
          openResultPicker(remaining);   // re-render with the row gone
        } else {
          closeResultPicker();
          showError('No past results remaining.');
        }
      } catch (err) { showError('Failed to delete: ' + err.message); }
    });
  });
}

function showError(msg) {
  errorMsg.textContent   = msg;
  errorMsg.style.display = 'block';
}

function resetToDropzone() {
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('dropzone').style.display  = 'flex';
  // A prior scrape hides the empty-state and shows the progress panel; restore
  // them so the landing controls (Run Now, Sign In, Configuration, etc.) reappear
  // instead of leaving a blank page with only the title.
  document.getElementById('progress-panel').style.display = 'none';
  document.getElementById('empty-state').style.display    = 'block';
  refreshAuthBadge();
  fileInput.value = '';
  errorMsg.style.display = 'none';
  // Reset rejected panel state
  rejOpen = false; rejRendered = false;
  sourceTab = 'jobright';
  document.getElementById('src-jobright').classList.add('active');
  document.getElementById('src-ats').classList.remove('active');
  document.getElementById('rej-content').style.display   = 'none';
  document.getElementById('rej-filter-bar').classList.remove('visible');
  document.getElementById('rej-header').classList.remove('open');
  document.getElementById('rej-toggle-icon').style.transform = '';
  rejState.tab = null;
  document.getElementById('tier-t1').checked = true;
}

// ═══════════════════════════════════════════════════════════════
// RENDER - main entry point
// ═══════════════════════════════════════════════════════════════
function render(data) {
  // Support both combined format {accepted:{...}, rejected:{...}}
  // and legacy single-section format {meta:{...}, roles:[...]}
  const isLegacy = !data.accepted;
  const accData  = isLegacy ? data         : data.accepted;
  const rejData  = isLegacy ? null         : data.rejected;

  const meta   = accData.meta  || {};
  allRoles     = accData.roles || [];
  allRejRoles  = rejData ? (rejData.roles || []) : [];

  // Section header labels - driven by track_locations from the JSON meta
  // Name the local area in the Hybrid / In-Person headers when every track
  // that has a location shares the same one; otherwise keep them generic.
  const _locs = [...new Set(Object.values(meta.track_locations || {}).filter(Boolean))];
  const _locSuffix = _locs.length === 1 ? ` ${_locs[0]}` : '';
  document.getElementById('label-hybrid').textContent   = `🔀 Hybrid${_locSuffix}`;
  document.getElementById('label-inperson').textContent = `📍 In-Person${_locSuffix}`;

  // Source tab counts
  document.getElementById('src-jobright-count').textContent = allRoles.filter(r => !isAtsRole(r)).length;
  document.getElementById('src-ats-count').textContent      = allRoles.filter(r =>  isAtsRole(r)).length;

  // Header meta
  document.getElementById('header-meta').innerHTML = [
    meta.date             ? `<span>📅 ${esc(meta.date)}${meta.time ? ` · 🕒 ${esc(meta.time)}` : ''}</span>` : '',
    meta.search_term      ? `<span>🔍 ${esc(meta.search_term)}</span>` : '',
    meta.locations        ? `<span>🌐 ${esc(meta.locations)}</span>` : '',
    meta.qualifying_count != null ? `<span>📊 ${esc(meta.qualifying_count)} qualifying roles</span>` : '',
  ].filter(Boolean).join('');


  // Stats bar
  trackColors = {};
  [...Object.keys(meta.track_labels || {}), ...allRoles.map(r => r.track), ...allRejRoles.map(r => r.track)]
    .filter(Boolean).forEach(trackColor);
  const trackCountChips = Object.entries(meta.track_counts || {}).map(([key, count]) => {
    const label = (meta.track_labels || {})[key] || key;
    return chip(label, count, trackColor(key));
  });
  const chips = [
    meta.reviewed_count   != null ? chip('Reviewed',    `${meta.reviewed_count} / ${meta.total_results || '?'}`) : '',
    meta.qualifying_count != null ? chip('Qualifying',  meta.qualifying_count) : '',
    meta.grade_a          != null ? chip('Grade A',     meta.grade_a,  'var(--grade-a)') : '',
    meta.grade_b          != null ? chip('Grade B',     meta.grade_b,  'var(--grade-b)') : '',
    meta.grade_c          != null ? chip('Grade C',     meta.grade_c,  'var(--grade-c)') : '',
    meta.excluded_count   != null ? chip('Excluded',    meta.excluded_count) : '',
    ...trackCountChips,
  ].filter(Boolean).join('');
  document.getElementById('stats-bar').innerHTML = chips;

  // Key observation
  if (meta.key_observation) {
    document.getElementById('observation-box').innerHTML =
      `<strong>Key observation:</strong> ${esc(meta.key_observation)}`;
  }

  // Rejected panel header counts
  if (allRejRoles.length) {
    const t1 = allRejRoles.filter(r => r.rejection_tier === 'tier1').length;
    const t2 = allRejRoles.filter(r => r.rejection_tier === 'tier2').length;
    document.getElementById('rej-t1-pill').textContent  = `${t1} near-miss`;
    document.getElementById('rej-t2-pill').textContent  = `+${t2} noise`;
    document.getElementById('rej-panel').style.display = 'block';
  } else {
    document.getElementById('rej-panel').style.display = 'none';
  }

  // Build dynamic track filter checkboxes from meta.track_labels
  const trackLabels = meta.track_labels || {};
  const trackKeys   = Object.keys(trackLabels).length ? Object.keys(trackLabels)
                    : [...new Set((accData.roles || []).map(r => r.track).filter(Boolean))];
  const trackGroup  = document.getElementById('track-filter-group');
  // Preserve current checked state for keys that were already present
  const prevTrackState = {};
  trackGroup.querySelectorAll('input[type=checkbox]').forEach(cb => {
    prevTrackState[cb.dataset.track] = cb.checked;
  });
  trackGroup.innerHTML = '<span>Track</span>';
  trackKeys.forEach(key => {
    const label  = trackLabels[key] || key;
    const checked = prevTrackState[key] !== undefined ? prevTrackState[key] : true;
    const lbl = document.createElement('label');
    lbl.innerHTML = `<input type="checkbox" data-track="${esc(key)}"${checked ? ' checked' : ''} onchange="onFilterChange()"> ${esc(label)} <small style="color:var(--muted);font-size:10px">(${esc(key)})</small>`;
    trackGroup.appendChild(lbl);
  });

  // Build dynamic role-type filter from unique role_cat values in loaded roles
  const allCats   = [...new Set((accData.roles || []).map(r => r.role_cat || 'Other'))].sort();
  const typeGroup = document.getElementById('type-filter-group');
  const prevTypeState = {};
  typeGroup.querySelectorAll('input[type=checkbox]').forEach(cb => {
    prevTypeState[cb.dataset.cat] = cb.checked;
  });
  typeGroup.innerHTML = '<span title="Set in Configuration, Tracks tab, under Role Types" style="cursor:help">Role Type</span>';
  allCats.forEach(cat => {
    const checked = prevTypeState[cat] !== undefined ? prevTypeState[cat] : true;
    const lbl = document.createElement('label');
    lbl.innerHTML = `<input type="checkbox" data-cat="${esc(cat)}"${checked ? ' checked' : ''} onchange="onFilterChange()"> ${esc(cat)}`;
    typeGroup.appendChild(lbl);
  });

  buildFacet('emp-filter-group', 'Employment', empOf);
  buildFacet('by-filter-group',  'Posted by',  byOf);

  applyTrackFilter();

  // If nothing was accepted but roles were reviewed and rejected, auto-expand the
  // rejected panel so the run is not a blank-looking screen.
  if ((accData.roles || []).length === 0 && allRejRoles.length > 0 && !rejOpen) {
    toggleRejPanel();
  }

  document.getElementById('dropzone').style.display  = 'none';
  document.getElementById('dashboard').style.display = 'block';
}

// ═══════════════════════════════════════════════════════════════
// ACCEPTED: FILTER + SECTIONS
// ═══════════════════════════════════════════════════════════════
// ── Employment type and poster filters ─────────────────────────
// One checkbox per value that came up in the run, accepted or rejected, with
// the number of accepted roles that have it. A run saved before these fields
// existed has neither, and the group is hidden.
function empOf(r) { return r.employment_type || null; }
function byOf(r)  { return (r.posted_by && r.posted_by.label) || null; }

function buildFacet(groupId, title, valueOf) {
  const group = document.getElementById(groupId);
  const prev = {};
  group.querySelectorAll('input[type=checkbox]').forEach(cb => { prev[cb.dataset.val] = cb.checked; });
  const vals = [...new Set([...allRoles, ...allRejRoles].map(valueOf).filter(Boolean))].sort();
  group.style.display = vals.length ? '' : 'none';
  group.innerHTML = `<span>${esc(title)}</span>`;
  for (const v of vals) {
    const n = allRoles.filter(r => valueOf(r) === v).length;
    const lbl = document.createElement('label');
    lbl.innerHTML = `<input type="checkbox" data-val="${esc(v)}"${prev[v] === false ? '' : ' checked'} onchange="onFilterChange()"> ` +
      `${esc(v)} <small style="color:var(--muted);font-size:10px">(${n})</small>`;
    group.appendChild(lbl);
  }
}
function facetHidden() {
  const off = id => new Set([...document.querySelectorAll(`#${id} input[type=checkbox]`)]
    .filter(cb => !cb.checked).map(cb => cb.dataset.val));
  return { emp: off('emp-filter-group'), by: off('by-filter-group') };
}
function passesFacets(r, hidden) {
  return !(empOf(r) && hidden.emp.has(empOf(r))) && !(byOf(r) && hidden.by.has(byOf(r)));
}

// Labels next to the role title. Full-time and "Not stated" are not shown, nor
// is the employer as poster; the filters above cover those.
// A target company is one the user especially wants to work for. Results saved
// before this field existed carried it as a "Target company" flag.
function isTarget(r) { return r.target_company === true || (r.flags || []).includes('Target company'); }

function roleTags(r) {
  const tags = [];
  if (isTarget(r)) tags.push('<span class="badge tag target">Target company</span>');
  const emp = empOf(r);
  if (emp && emp !== 'Full-time' && emp !== 'Not stated') tags.push(`<span class="badge tag">${esc(emp)}</span>`);
  if (r.posted_by && r.posted_by.kind !== 'employer') {
    tags.push(`<span class="badge tag${r.posted_by.kind === 'job_board' ? ' board' : ''}">${esc(r.posted_by.label)}</span>`);
  }
  const also = r.also_posted_by || [];
  if (also.length) {
    tags.push(`<span class="badge tag" title="${esc('Also posted by ' + also.map(a => a.company).join(', '))}">+${also.length} more</span>`);
  }
  return tags.join('');
}

// Who posted it, why it was labeled that way, and the other copies of the job.
function sourceHtml(r) {
  if (!r.posted_by && !r.employment_type) return '';
  const reasons = (r.posted_by?.reasons || []).map(x => `<li>${esc(x)}</li>`).join('');
  const also = (r.also_posted_by || []).map(a => {
    const u = safeUrl(a.apply_url);
    const name = u ? `<a href="${escHtml(u)}" target="_blank" rel="noopener noreferrer">${esc(a.company)}</a>` : esc(a.company);
    return `<li>${name} (${esc(a.posted_by || '')})</li>`;
  }).join('');
  return `<div class="source-block">
    ${r.employment_type ? `<div><strong>Employment:</strong> ${esc(r.employment_type)}</div>` : ''}
    ${r.posted_by ? `<div><strong>Posted by:</strong> ${esc(r.posted_by.label)}${reasons ? `<ul>${reasons}</ul>` : ''}</div>` : ''}
    ${also ? `<div><strong>Also posted by:</strong><ul>${also}</ul></div>` : ''}
  </div>`;
}

function onFilterChange() {
  applyTrackFilter();
  if (rejOpen && rejRendered) renderRejectedSection();
}

function handleSourceTab(tab) {
  sourceTab = tab;
  document.getElementById('src-jobright').classList.toggle('active', tab === 'jobright');
  document.getElementById('src-ats').classList.toggle('active',      tab === 'ats');
  applyTrackFilter();
  if (rejOpen) { rejRendered = false; renderRejectedSection(); rejRendered = true; }
}

function applyTrackFilter() {
  const activeTracks = new Set(
    [...document.querySelectorAll('#track-filter-group input[type=checkbox]')]
      .filter(cb => cb.checked).map(cb => cb.dataset.track)
  );
  const activeTypes = new Set(
    [...document.querySelectorAll('#type-filter-group input[type=checkbox]')]
      .filter(cb => cb.checked).map(cb => cb.dataset.cat)
  );
  // If filters haven't been built yet (no data loaded), show everything
  const noTrackFilter = activeTracks.size === 0;
  const noTypeFilter  = activeTypes.size  === 0;
  const hidden = facetHidden();
  filteredRoles = allRoles.filter(r =>
    (noTrackFilter || activeTracks.has(r.track)) &&
    (noTypeFilter  || activeTypes.has(r.role_cat || 'Other')) &&
    passesFacets(r, hidden) &&
    (sourceTab === 'ats' ? isAtsRole(r) : !isAtsRole(r))
  );
  renderAllSections();
}

function resetFilters() {
  document.querySelectorAll('#track-filter-group input[type=checkbox]').forEach(cb => { cb.checked = true; });
  document.querySelectorAll('#type-filter-group input[type=checkbox]').forEach(cb => { cb.checked = true; });
  document.querySelectorAll('#emp-filter-group input[type=checkbox], #by-filter-group input[type=checkbox]')
    .forEach(cb => { cb.checked = true; });
  onFilterChange();
}

function renderAllSections() {
  renderSection('remote',   'remote');
  renderSection('hybrid',   'hybrid');
  renderSection('inperson', 'in-person');
}

// ── Role type tabs ──────────────────────────────────────────────
// Built from the role types present in the roles being shown, the same way the
// Role Type checkboxes are. Nothing here depends on any particular label, so
// renaming or adding a role type in Configuration can never silently move
// roles between tabs. The bar is hidden when there is only one type to show.
//
// Labels come from user config, so they are never placed inside JavaScript:
// each button carries its label in data-type and the handler reads it back
// with this.dataset.type. The "All" button has no data-type, which reads as null.
function roleTypeOf(r) { return r.role_cat || 'Other'; }

function roleTypeTabs(roles) {
  const counts = new Map();
  for (const r of roles) counts.set(roleTypeOf(r), (counts.get(roleTypeOf(r)) || 0) + 1);
  // Same order as the Role Type checkboxes (plain .sort() on the labels).
  return [...counts.entries()].sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
}

// Keep the selected type while it still has roles; otherwise fall back to All.
function currentRoleTab(selected, tabs) {
  return selected !== null && tabs.some(([t]) => t === selected) ? selected : null;
}

function rolesOfType(roles, type) {
  return type === null ? roles : roles.filter(r => roleTypeOf(r) === type);
}

function roleTypeTabButtons(tabs, total, active, handler) {
  const btn = (type, label, count) =>
    `<button class="tab-btn${type === active ? ' active' : ''}"` +
    (type === null ? '' : ` data-type="${esc(type)}"`) +
    ` onclick="${handler}">${esc(label)} <span class="tab-count">${count}</span></button>`;
  return btn(null, 'All', total) + tabs.map(([t, n]) => btn(t, t, n)).join('');
}

function renderSection(sectionId, bucket) {
  const ss           = sectionState[sectionId];
  const sectionRoles = filteredRoles.filter(r => r.work_type_bucket === bucket);
  const tabs         = roleTypeTabs(sectionRoles);
  ss.tab             = currentRoleTab(ss.tab, tabs);
  const sorted       = sortRoles(rolesOfType(sectionRoles, ss.tab), ss.sortCol, ss.sortDir);

  const countEl = document.getElementById(sectionId + '-count');
  if (countEl) countEl.textContent = `${sectionRoles.length} total`;

  const container = document.getElementById(sectionId + '-section');
  if (!container) return;
  const tabBar = tabs.length < 2 ? '' :
    `<div class="tab-bar">${roleTypeTabButtons(tabs, sectionRoles.length, ss.tab,
      `handleTab('${sectionId}', this.dataset.type ?? null)`)}</div>`;
  container.innerHTML = tabBar + buildTableHtml(sorted, sectionId);
}

// ═══════════════════════════════════════════════════════════════
// ACCEPTED: TABLE BUILDER
// ═══════════════════════════════════════════════════════════════
const COLS = [
  { key: 'expand',  label: '',        sortable: false, style: 'width:24px' },
  { key: 'company', label: 'Company', sortable: true },
  { key: 'title',   label: 'Role',    sortable: true },
  { key: 'track',   label: 'Track',   sortable: false },
  { key: 'type',    label: 'Work Type', sortable: false },
  { key: 'posted',  label: 'Posted',  sortable: true },
  { key: 'salary',  label: 'Salary',  sortable: false },
  { key: 'grade',   label: 'Grade',   sortable: true,  center: true },
  { key: 'apply',   label: 'Apply',   sortable: false, center: true },
];

function buildTableHtml(roles, sectionId) {
  const ss      = sectionState[sectionId];
  const colspan = COLS.length;
  const theadCells = COLS.map(col => {
    const cc = col.center ? ' col-center' : '';
    if (!col.sortable) return `<th class="${cc.trim()}"${col.style ? ` style="${col.style}"` : ''}>${col.label}</th>`;
    const isActive = ss.sortCol === col.key;
    const icon = isActive ? (ss.sortDir === 'asc' ? '↑' : '↓') : '↕';
    return `<th class="sortable${isActive ? ' sort-active' : ''}${cc}" onclick="handleSort('${sectionId}','${col.key}')">
      ${col.label}<span class="sort-icon">${icon}</span>
    </th>`;
  }).join('');
  const rows = roles.length
    ? roles.map(r => roleRowPair(r, colspan)).join('')
    : `<tr><td colspan="${colspan}"><div class="no-results">No roles found.</div></td></tr>`;
  return `<div class="table-scroll"><table><thead><tr>${theadCells}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ═══════════════════════════════════════════════════════════════
// ACCEPTED: ROW PAIR (main + expandable detail)
// ═══════════════════════════════════════════════════════════════
function roleRowPair(r, colspan) {
  const id   = r.id || Math.random().toString(36).slice(2);
  const dims = r.dimensions || {};
  const pre  = r.prescreen  || {};

  const typeMap = {
    'remote':    { label: 'Remote',    cls: 'type-remote' },
    'hybrid':    { label: 'Hybrid',    cls: 'type-hybrid' },
    'in-person': { label: 'In-Person', cls: 'type-inperson' },
  };
  const wtBase = typeMap[r.work_type_bucket] || { label: r.work_type_bucket || '-', cls: '' };
  const wt = { ...wtBase, label: wtBase.label + (r.arrangement_uncertain ? '?' : '') };

  const capped    = r.fit && r.grade && r.fit !== r.grade;
  const capArrow  = capped ? `<span class="cap-arrow" title="Lowered from ${esc(r.fit)}">↓</span>` : '';
  const gradeBadge = `<span class="badge grade-${esc(r.grade)}">${esc(r.grade)}${capArrow}</span>`;

  const ageTier   = r.age_tier || 'Unknown';
  const postedHtml = `<span class="posted-${ageTier}">${esc(r.posted || 'Unknown')}</span>`;
  const trackBadge = r.track ? `<span class="badge track" style="--track-color:${trackColor(r.track)}">${esc(r.track)}</span>` : '-';

  const mainRow = `
    <tr class="job-row" onclick="toggle('${id}')">
      <td><span class="expand-icon" id="icon-${id}">▶</span></td>
      <td>
        <div class="company-name">${esc(r.company)}</div>
        <div class="location-text">${esc(r.location || '')}</div>
      </td>
      <td><div class="role-title">${esc(r.role_title)}${roleTags(r)}</div></td>
      <td>${trackBadge}</td>
      <td><span class="badge ${wt.cls}">${wt.label}</span></td>
      <td>${postedHtml}</td>
      <td><span class="salary${r.salary_unknown ? ' unknown' : ''}">${esc(r.salary || 'Not listed')}</span></td>
      <td class="col-center">${gradeBadge}</td>
      <td class="col-center">${safeUrl(r.apply_url)
        ? `<a class="apply-link" href="${escHtml(safeUrl(r.apply_url))}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Apply →</a>`
        : '<span style="color:var(--muted);font-size:12px">-</span>'}
      </td>
    </tr>`;

  // Color a signal by how much of it the job earned, on the same 5-step scale.
  const shade = (pts, max) => !max ? 3 : pts >= max ? 5 : pts / max >= 0.75 ? 4 : pts / max >= 0.5 ? 3 : pts > 0 ? 2 : 1;
  const scoreRows = r.match
    ? (r.match.parts || []).map(p =>
        `<tr><td>${esc(p.signal)}</td><td class="dim-${shade(p.points, p.max)}">${esc(p.points)} / ${esc(p.max)}</td><td>${esc(p.detail || '')}</td></tr>`
      ).join('')
    : DIM_KEYS.map((key, i) => {
        const d = dims[key] || {};
        const score = d.score != null ? d.score : '-';
        return `<tr><td>${DIM_LABELS[i]}</td><td class="dim-${esc(score)}">${esc(score)}</td><td>${esc(d.rationale || '')}</td></tr>`;
      }).join('');
  const scoreText = r.match
    ? `${esc(r.match.score)} / 100`
    : `${r.weighted_score != null ? esc(r.weighted_score) : '-'} / 25`;

  const fitPart = capped
    ? `<span>Fit: <strong class="cap-explain">${esc(r.fit)} → lowered to ${esc(r.grade)}</strong></span>
       <span class="cap-explain">⚠ ${esc(r.age_tier || '')} posting</span>`
    : '';
  const capNoteParts = [
    r.d6_cap  ? `D6 cap applied: <strong>${esc(r.d6_cap)}</strong>` : '',
    r.age_cap ? `Age cap: <strong>${esc(r.age_cap)}</strong>` : '',
  ].filter(Boolean);

  const rawScore = `<div class="raw-score">
    <span>Score: <strong>${scoreText}</strong></span>
    <span>Grade: <strong>${esc(r.grade)}</strong></span>
    ${fitPart}
    ${capNoteParts.map(s => `<span>${s}</span>`).join('')}
    ${r.age_tier ? `<span>Age: <strong class="posted-${esc(r.age_tier)}">${esc(r.age_tier)}</strong></span>` : ''}
  </div>`;

  const prescreenHtml = Object.entries(pre).map(([, q]) => {
    const cls  = q.pass ? 'ps-pass' : 'ps-warn';
    const icon = q.pass ? '✓' : '⚠';
    return `<div class="prescreen-item"><span class="ps-icon ${cls}">${icon}</span><span>${esc(q.note || '')}</span></div>`;
  }).join('');

  const flagsHtml = (r.flags || []).filter(f => f !== 'Target company').map(f =>
    `<div style="color:var(--flag);font-size:12px;margin-top:4px">⚠ ${esc(f)}</div>`
  ).join('');

  const addendumHtml = r.addendum_note
    ? `<div class="addendum-note">⚠ ADDENDUM: ${esc(r.addendum_note)}</div>` : '';

  const detailRow = `
    <tr class="detail-row" id="detail-${id}">
      <td colspan="${colspan}" class="detail-cell">
        <div class="detail-inner">
          <div class="detail-block">
            <h4>${r.match ? 'Match Score' : 'Dimension Scores'}</h4>
            <table class="dim-table${r.match ? ' match-table' : ''}">${scoreRows}</table>
            ${rawScore}
          </div>
          <div class="detail-block">
            <h4>Pre-Screen &amp; Notes</h4>
            ${sourceHtml(r)}
            ${prescreenHtml ? `<div class="prescreen">${prescreenHtml}</div>` : ''}
            <div class="notes-text">${esc(r.notes || '-')}</div>
            ${flagsHtml}
            ${addendumHtml}
          </div>
        </div>
      </td>
    </tr>`;

  return mainRow + detailRow;
}

// ═══════════════════════════════════════════════════════════════
// REJECTED PANEL
// ═══════════════════════════════════════════════════════════════
function toggleRejPanel() {
  rejOpen = !rejOpen;
  const content  = document.getElementById('rej-content');
  const filterBar = document.getElementById('rej-filter-bar');
  const icon      = document.getElementById('rej-toggle-icon');
  const header    = document.getElementById('rej-header');

  if (rejOpen) {
    content.style.display = 'block';
    filterBar.classList.add('visible');
    icon.style.transform = 'rotate(90deg)';
    header.classList.add('open');
    // Show noise pill now that panel is open
    document.getElementById('rej-t2-pill').style.display = '';
    if (!rejRendered) {
      renderRejectedSection();
      rejRendered = true;
    }
  } else {
    content.style.display = 'none';
    filterBar.classList.remove('visible');
    icon.style.transform = '';
    header.classList.remove('open');
    document.getElementById('rej-t2-pill').style.display = 'none';
  }
}

function onRejFilterChange() {
  rejState.tier = document.querySelector('input[name="tier"]:checked').value;
  renderRejectedSection();
}

function handleRejTab(tab) {
  rejState.tab = tab;
  renderRejectedSection();
}

function getFilteredRejRoles() {
  // Same track checkboxes as the accepted side. If none are checked, show all tracks.
  const activeTracks = new Set(
    [...document.querySelectorAll('#track-filter-group input[type=checkbox]')]
      .filter(cb => cb.checked).map(cb => cb.dataset.track)
  );
  const noTrackFilter = activeTracks.size === 0;
  let roles = allRejRoles.filter(r =>
    (noTrackFilter || activeTracks.has(r.track)) &&
    (sourceTab === 'ats' ? isAtsRole(r) : !isAtsRole(r))
  );
  if (rejState.tier !== 'all') {
    roles = roles.filter(r => r.rejection_tier === rejState.tier);
  }
  // Honor the Role Type checkboxes too. They are built from accepted roles
  // only, so a type that appears only among rejections has no checkbox; only
  // types the user has explicitly unchecked are hidden here.
  const uncheckedTypes = new Set(
    [...document.querySelectorAll('#type-filter-group input[type=checkbox]')]
      .filter(cb => !cb.checked).map(cb => cb.dataset.cat)
  );
  if (uncheckedTypes.size) roles = roles.filter(r => !uncheckedTypes.has(roleTypeOf(r)));
  const hidden = facetHidden();
  return roles.filter(r => passesFacets(r, hidden));
}

function renderRejectedSection() {
  const allFiltered = getFilteredRejRoles();
  const tabs        = roleTypeTabs(allFiltered);
  rejState.tab      = currentRoleTab(rejState.tab, tabs);
  const activeRoles = rolesOfType(allFiltered, rejState.tab);
  const sorted      = sortRejRoles(activeRoles);

  document.getElementById('rej-tab-group').style.display = tabs.length < 2 ? 'none' : '';
  document.getElementById('rej-tab-buttons').innerHTML =
    roleTypeTabButtons(tabs, allFiltered.length, rejState.tab, 'handleRejTab(this.dataset.type ?? null)');

  const content = document.getElementById('rej-content');
  if (!activeRoles.length) {
    content.innerHTML = `<div class="no-results">No screened-out roles match current filters.</div>`;
    return;
  }
  content.innerHTML = buildRejTableHtml(sorted);
}

// ── Rejected table columns ────────────────────────────────────
const REJ_COLS = [
  { key: 'expand',   label: '',         sortable: false, style: 'width:24px' },
  { key: 'company',  label: 'Company',  sortable: true },
  { key: 'title',    label: 'Role',     sortable: true },
  { key: 'track',    label: 'Track',    sortable: false },
  { key: 'type',     label: 'Work Type', sortable: false },
  { key: 'posted',   label: 'Posted',   sortable: true },
  { key: 'salary',   label: 'Salary',   sortable: false },
  { key: 'category', label: 'Reason',   sortable: true },
  { key: 'apply',    label: 'Apply',    sortable: false, center: true },
];

function buildRejTableHtml(roles) {
  const colspan = REJ_COLS.length;
  const theadCells = REJ_COLS.map(col => {
    const cc = col.center ? ' col-center' : '';
    if (!col.sortable) return `<th class="${cc.trim()}"${col.style ? ` style="${col.style}"` : ''}>${col.label}</th>`;
    const isActive = rejState.sortCol === col.key;
    const icon = isActive ? (rejState.sortDir === 'asc' ? '↑' : '↓') : '↕';
    return `<th class="sortable${isActive ? ' sort-active' : ''}" onclick="handleRejSort('${col.key}')">
      ${col.label}<span class="sort-icon">${icon}</span>
    </th>`;
  }).join('');
  const rows = roles.map(r => rejRowPair(r, colspan)).join('');
  return `<div class="table-scroll"><table><thead><tr>${theadCells}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function rejRowPair(r, colspan) {
  const id = 'r-' + (r.id || Math.random().toString(36).slice(2));

  const typeMap = {
    'remote':    { label: 'Remote',    cls: 'type-remote' },
    'hybrid':    { label: 'Hybrid',    cls: 'type-hybrid' },
    'in-person': { label: 'In-Person', cls: 'type-inperson' },
  };
  const wtBase = typeMap[r.work_type_bucket] || { label: r.work_type_bucket || '-', cls: '' };
  const wt = { ...wtBase, label: wtBase.label + (r.arrangement_uncertain ? '?' : '') };

  const ageTier    = r.age_tier || 'Unknown';
  const postedHtml = `<span class="posted-${ageTier}">${esc(r.posted || 'Unknown')}</span>`;
  const trackBadge = r.track ? `<span class="badge track" style="--track-color:${trackColor(r.track)}">${esc(r.track)}</span>` : '-';

  const cat      = r.reason_cat || 'other';
  const catLabel = REJ_CAT_LABELS[cat] || cat;
  const catBadge = `<span class="reason-cat rcat-${cat}">${catLabel}</span>`;

  const mainRow = `
    <tr class="job-row" onclick="toggleRej('${id}')">
      <td><span class="expand-icon" id="icon-${id}">▶</span></td>
      <td>
        <div class="company-name">${esc(r.company)}</div>
        <div class="location-text">${esc(r.location || '')}</div>
      </td>
      <td><div class="role-title">${esc(r.role_title)}${roleTags(r)}</div></td>
      <td>${trackBadge}</td>
      <td><span class="badge ${wt.cls}">${wt.label}</span></td>
      <td>${postedHtml}</td>
      <td><span class="salary${r.salary_unknown ? ' unknown' : ''}">${esc(r.salary || 'Not listed')}</span></td>
      <td>${catBadge}</td>
      <td class="col-center">${safeUrl(r.apply_url)
        ? `<a class="apply-link" href="${escHtml(safeUrl(r.apply_url))}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Apply →</a>`
        : '<span style="color:var(--muted);font-size:12px">-</span>'}
      </td>
    </tr>`;

  const detailRow = `
    <tr class="detail-row" id="detail-${id}">
      <td colspan="${colspan}" class="rej-detail-cell">
        <div class="rej-reason-full">✗ ${esc(r.reason || '-')}</div>
        ${sourceHtml(r)}
        ${r.notes ? `<div class="rej-notes">${esc(r.notes)}</div>` : ''}
      </td>
    </tr>`;

  return mainRow + detailRow;
}

// ═══════════════════════════════════════════════════════════════
// SORT
// ═══════════════════════════════════════════════════════════════
function sortRoles(roles, col, dir) {
  return [...roles].sort((a, b) => {
    let va, vb;
    switch (col) {
      case 'company': va = a.company.toLowerCase();    vb = b.company.toLowerCase();    break;
      case 'title':   va = a.role_title.toLowerCase(); vb = b.role_title.toLowerCase(); break;
      case 'posted':  va = a.posted_days ?? 999;       vb = b.posted_days ?? 999;       break;
      case 'grade':   va = GRADE_ORDER[a.grade] ?? 99; vb = GRADE_ORDER[b.grade] ?? 99; break;
      case 'score':   va = -(a.match?.score ?? a.weighted_score ?? 0);   vb = -(b.match?.score ?? b.weighted_score ?? 0);   break;
      default:        va = 0; vb = 0;
    }
    if (va < vb) return dir === 'asc' ? -1 : 1;
    if (va > vb) return dir === 'asc' ?  1 : -1;
    const ga = GRADE_ORDER[a.grade] ?? 99, gb = GRADE_ORDER[b.grade] ?? 99;
    if (ga !== gb) return ga - gb;
    return a.company.toLowerCase() < b.company.toLowerCase() ? -1 : 1;
  });
}

function sortRejRoles(roles) {
  const col = rejState.sortCol, dir = rejState.sortDir;
  return [...roles].sort((a, b) => {
    let va, vb;
    switch (col) {
      case 'company':  va = a.company.toLowerCase();    vb = b.company.toLowerCase();    break;
      case 'title':    va = a.role_title.toLowerCase(); vb = b.role_title.toLowerCase(); break;
      case 'posted':   va = a.posted_days ?? 999;       vb = b.posted_days ?? 999;       break;
      case 'category': va = REJ_CAT_ORDER.indexOf(a.reason_cat ?? 'other');
                       vb = REJ_CAT_ORDER.indexOf(b.reason_cat ?? 'other');
                       if (va < 0) va = 99; if (vb < 0) vb = 99;              break;
      default:         va = 0; vb = 0;
    }
    if (va < vb) return dir === 'asc' ? -1 : 1;
    if (va > vb) return dir === 'asc' ?  1 : -1;
    return a.company.toLowerCase() < b.company.toLowerCase() ? -1 : 1;
  });
}

function handleRejSort(col) {
  if (rejState.sortCol === col) {
    rejState.sortDir = rejState.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    rejState.sortCol = col;
    rejState.sortDir = 'asc';
  }
  renderRejectedSection();
}

// ═══════════════════════════════════════════════════════════════
// EVENT HANDLERS
// ═══════════════════════════════════════════════════════════════
function handleSort(sectionId, col) {
  const ss = sectionState[sectionId];
  if (ss.sortCol === col) {
    ss.sortDir = ss.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    ss.sortCol = col;
    ss.sortDir = 'asc';
  }
  const buckets = { remote: 'remote', hybrid: 'hybrid', inperson: 'in-person' };
  renderSection(sectionId, buckets[sectionId]);
}

function handleTab(sectionId, tab) {
  sectionState[sectionId].tab = tab;
  const buckets = { remote: 'remote', hybrid: 'hybrid', inperson: 'in-person' };
  renderSection(sectionId, buckets[sectionId]);
}

function toggle(id) {
  const detailRow = document.getElementById('detail-' + id);
  if (!detailRow) return;
  const jobRow = detailRow.previousElementSibling;
  const icon   = document.getElementById('icon-' + id);
  const open   = detailRow.classList.contains('visible');
  if (open) {
    detailRow.classList.remove('visible');
    if (jobRow) jobRow.classList.remove('expanded');
    if (icon)   icon.style.transform = '';
  } else {
    detailRow.classList.add('visible');
    if (jobRow) jobRow.classList.add('expanded');
    if (icon)   icon.style.transform = 'rotate(90deg)';
  }
}

function toggleRej(id) {
  const detailRow = document.getElementById('detail-' + id);
  if (!detailRow) return;
  const jobRow = detailRow.previousElementSibling;
  const icon   = document.getElementById('icon-' + id);
  const open   = detailRow.classList.contains('visible');
  if (open) {
    detailRow.classList.remove('visible');
    if (jobRow) jobRow.classList.remove('expanded');
    if (icon)   icon.style.transform = '';
  } else {
    detailRow.classList.add('visible');
    if (jobRow) jobRow.classList.add('expanded');
    if (icon)   icon.style.transform = 'rotate(90deg)';
  }
}

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════
function chip(label, val, color) {
  const valHtml = color
    ? `<span class="val" style="color:${color}">${val}</span>`
    : `<span class="val">${val}</span>`;
  return `<div class="stat-chip">${label} ${valHtml}</div>`;
}

// esc() is kept as the local name for the shared helper so the ~14 existing
// call sites stay untouched. The shared version also escapes ' , which the
// previous local copy did not, and this page interpolates into single-quoted
// inline handler arguments.
function esc(str) { return escHtml(str); }
